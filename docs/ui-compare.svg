<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <!-- window frame + title bar -->
  <rect x="0.5" y="0.5" width="899" height="429" rx="8" fill="#1b1b1b" stroke="#3a3a3a"/>
  <rect x="1" y="1" width="898" height="34" rx="8" fill="#232323"/>
  <rect x="1" y="26" width="898" height="9" fill="#232323"/>
  <text x="12" y="23" fill="#e8e8e8" font-size="12.5">DLSSNR 画面对比 —— 左：原始&#12288;右：DLSSNR&#12288;（拖动分隔线；面板里改参数即时生效）</text>
  <g fill="#c8c8c8" font-size="13">
    <text x="842" y="23" text-anchor="middle">&#8212;</text>
    <text x="864" y="22" text-anchor="middle">&#9723;</text>
    <text x="886" y="23" text-anchor="middle" fill="#d05050">&#215;</text>
  </g>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ead8"/><stop offset="1" stop-color="#e4dbc6"/>
    </linearGradient>
    <clipPath id="img"><rect x="8" y="42" width="884" height="352"/></clipPath>
    <clipPath id="left"><rect x="8" y="42" width="442" height="352"/></clipPath>
  </defs>

  <!-- the same frame on both sides; the left one just carries the grain the engine removes -->
  <g clip-path="url(#img)">
    <rect x="8" y="42" width="884" height="352" fill="url(#sky)"/>
    <g stroke="#6d6152" stroke-width="9" stroke-opacity="0.5">
      <path d="M150 42 L120 394"/><path d="M330 42 L330 394"/><path d="M540 42 L570 394"/><path d="M740 42 L780 394"/>
      <path d="M8 120 L892 120"/><path d="M8 250 L892 250"/>
    </g>
    <path d="M8 322 Q450 288 892 326 L892 394 L8 394 Z" fill="#ded3bb" opacity="0.85"/>
    <path d="M400 226 L466 226 L456 372 L410 372 Z" fill="#ffffff" opacity="0.72" stroke="#b9b0a0"/>
    <path d="M432 226 C430 184 436 148 442 120" stroke="#5d8a4a" stroke-width="5" fill="none"/>
    <g transform="translate(452,104)">
      <g fill="#ffffff" stroke="#cfc9bb">
        <ellipse cx="0" cy="-26" rx="11" ry="20"/><ellipse cx="22" cy="-14" rx="11" ry="20" transform="rotate(60 22 -14)"/>
        <ellipse cx="22" cy="14" rx="11" ry="20" transform="rotate(-60 22 14)"/><ellipse cx="-22" cy="-14" rx="11" ry="20" transform="rotate(-60 -22 -14)"/>
        <ellipse cx="-22" cy="14" rx="11" ry="20" transform="rotate(60 -22 14)"/>
      </g>
      <circle cx="0" cy="0" r="11" fill="#d8cf74" stroke="#b9ae54"/>
    </g>
    <g>
      <circle cx="770" cy="300" r="16" fill="#d9c86a"/><circle cx="800" cy="284" r="13" fill="#e6e6e6"/>
      <circle cx="836" cy="300" r="15" fill="#b9a6d8"/>
      <path d="M742 322 L860 322 L850 374 L752 374 Z" fill="#efe9dc" stroke="#c9c0ad"/>
    </g>
  </g>

  <!-- grain only on the left half -->
  <g clip-path="url(#left)" opacity="0.55">
    <g fill="#9a8f7c">
      <circle cx="60" cy="90" r="1.7"/><circle cx="130" cy="176" r="1.5"/><circle cx="200" cy="108" r="1.8"/>
      <circle cx="90" cy="258" r="1.6"/><circle cx="240" cy="216" r="1.5"/><circle cx="170" cy="330" r="1.7"/>
      <circle cx="300" cy="72" r="1.5"/><circle cx="262" cy="296" r="1.6"/><circle cx="62" cy="348" r="1.5"/>
      <circle cx="330" cy="158" r="1.6"/><circle cx="212" cy="366" r="1.7"/><circle cx="120" cy="140" r="1.4"/>
      <circle cx="390" cy="240" r="1.6"/><circle cx="366" cy="120" r="1.4"/><circle cx="410" cy="330" r="1.5"/>
    </g>
    <g fill="#c9bda6">
      <circle cx="100" cy="208" r="1.3"/><circle cx="282" cy="248" r="1.3"/><circle cx="42" cy="160" r="1.3"/>
      <circle cx="350" cy="322" r="1.3"/><circle cx="150" cy="62" r="1.3"/><circle cx="230" cy="138" r="1.3"/>
      <circle cx="430" cy="180" r="1.3"/><circle cx="380" cy="300" r="1.3"/>
    </g>
  </g>

  <!-- divider + handle -->
  <line x1="450" y1="42" x2="450" y2="394" stroke="#f0f0f0" stroke-width="2"/>
  <circle cx="450" cy="218" r="10" fill="#141414" stroke="#f0f0f0" stroke-width="2"/>

  <!-- chips -->
  <g font-size="13" font-weight="600">
    <rect x="20" y="52" width="74" height="26" rx="3" fill="#121212" fill-opacity="0.88"/>
    <text x="57" y="70" fill="#ffffff" text-anchor="middle">原始</text>
    <rect x="806" y="52" width="74" height="26" rx="3" fill="#121212" fill-opacity="0.88"/>
    <text x="843" y="70" fill="#ffffff" text-anchor="middle">DLSSNR</text>
  </g>

  <g fill="#7fb3e8" font-size="11.5">
    <text x="20" y="412">① 左半：这一帧进来时的样子（含噪点/颗粒）</text>
    <text x="470" y="412">② 右半：引擎按当前参数处理后（降噪 / 结构）</text>
    <text x="470" y="428">拖动中间圆点或按 ← / → 移动分隔线，同屏对照</text>
    <text x="20" y="428">面板「对比」页里保留全部参数控件，改动即时反映在右半</text>
  </g>
</svg>
