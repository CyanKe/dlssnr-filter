<svg xmlns="http://www.w3.org/2000/svg" width="600" height="470" viewBox="0 0 600 470" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="600" height="470" rx="10" fill="#161616" stroke="#2b2b2b"/>
  <!-- title bar -->
  <text x="14" y="26" fill="#e8e8e8" font-size="15" font-weight="600">DLSSNR 控制面板</text>
  <text x="566" y="27" fill="#c0192a" font-size="17" font-weight="700" text-anchor="middle">&#215;</text>
  <line x1="0" y1="40" x2="600" y2="40" stroke="#c0192a" stroke-opacity="0.55"/>

  <!-- tab strip -->
  <g font-size="13" text-anchor="middle">
    <rect x="12" y="52" width="78" height="30" rx="3" fill="#1e1e1e" stroke="#3a3a3a"/>
    <text x="51" y="72" fill="#d8d8d8">参数</text>
    <rect x="96" y="52" width="78" height="30" rx="3" fill="#1e1e1e" stroke="#3a3a3a"/>
    <text x="135" y="72" fill="#d8d8d8">状态</text>
    <rect x="180" y="52" width="78" height="30" rx="3" fill="#c0192a"/>
    <text x="219" y="72" fill="#ffffff" font-weight="600">对比</text>
    <rect x="424" y="52" width="78" height="30" rx="3" fill="#c0192a"/>
    <text x="463" y="72" fill="#ffffff" font-weight="600">中文</text>
    <rect x="508" y="52" width="78" height="30" rx="3" fill="#1e1e1e" stroke="#3a3a3a"/>
    <text x="547" y="72" fill="#d8d8d8">English</text>
  </g>

  <!-- style segments -->
  <g font-size="13" text-anchor="middle">
    <text x="14" y="105" fill="#a0a0a0" font-size="12">风格</text>
    <rect x="96" y="88" width="86" height="26" rx="3" fill="#1e1e1e" stroke="#3a3a3a"/>
    <text x="139" y="106" fill="#d8d8d8">默认</text>
    <rect x="188" y="88" width="86" height="26" rx="3" fill="#c0192a"/>
    <text x="231" y="106" fill="#ffffff" font-weight="600">自然</text>
    <rect x="280" y="88" width="86" height="26" rx="3" fill="#1e1e1e" stroke="#3a3a3a"/>
    <text x="323" y="106" fill="#d8d8d8">电影</text>
    <rect x="372" y="88" width="86" height="26" rx="3" fill="#1e1e1e" stroke="#3a3a3a"/>
    <text x="415" y="106" fill="#d8d8d8">风格3</text>
  </g>

  <!-- slider rows -->
  <g font-size="13">
    <text x="14" y="146" fill="#e8e8e8">强度</text>
    <rect x="96" y="138" width="300" height="6" rx="3" fill="#2a2a2a"/>
    <rect x="96" y="138" width="300" height="6" rx="3" fill="#c0192a"/>
    <rect x="388" y="130" width="12" height="22" rx="2" fill="#d8d8d8"/>
    <text x="418" y="146" fill="#e8e8e8">100%</text>
    <rect x="492" y="130" width="76" height="24" rx="3" fill="#1e1e1e" stroke="#3a3a3a"/>
    <text x="530" y="147" fill="#d8d8d8" text-anchor="middle">重置</text>

    <text x="14" y="188" fill="#e8e8e8">局部色调</text>
    <rect x="96" y="180" width="300" height="6" rx="3" fill="#2a2a2a"/>
    <rect x="96" y="180" width="300" height="6" rx="3" fill="#c0192a"/>
    <rect x="388" y="172" width="12" height="22" rx="2" fill="#d8d8d8"/>
    <text x="418" y="188" fill="#e8e8e8">100%</text>
    <rect x="492" y="172" width="76" height="24" rx="3" fill="#1e1e1e" stroke="#3a3a3a"/>
    <text x="530" y="189" fill="#d8d8d8" text-anchor="middle">重置</text>

    <text x="14" y="230" fill="#e8e8e8">局部结构</text>
    <rect x="96" y="222" width="300" height="6" rx="3" fill="#2a2a2a"/>
    <rect x="96" y="222" width="300" height="6" rx="3" fill="#c0192a"/>
    <rect x="388" y="214" width="12" height="22" rx="2" fill="#d8d8d8"/>
    <text x="418" y="230" fill="#e8e8e8">100%</text>
    <rect x="492" y="214" width="76" height="24" rx="3" fill="#1e1e1e" stroke="#3a3a3a"/>
    <text x="530" y="231" fill="#d8d8d8" text-anchor="middle">重置</text>

    <text x="14" y="272" fill="#e8e8e8">皮肤结构</text>
    <rect x="96" y="264" width="300" height="6" rx="3" fill="#2a2a2a"/>
    <rect x="96" y="264" width="14" height="6" rx="3" fill="#c0192a"/>
    <rect x="102" y="256" width="12" height="22" rx="2" fill="#d8d8d8"/>
    <text x="418" y="272" fill="#e8e8e8">0%</text>
    <rect x="492" y="256" width="76" height="24" rx="3" fill="#1e1e1e" stroke="#3a3a3a"/>
    <text x="530" y="273" fill="#d8d8d8" text-anchor="middle">重置</text>
  </g>

  <!-- checkboxes -->
  <g font-size="13" fill="#e8e8e8">
    <rect x="14" y="300" width="18" height="18" rx="2" fill="#c0192a"/>
    <path d="M18 309 l4 5 l7 -9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="40" y="314">启用 DLSSNR</text>
    <rect x="190" y="300" width="18" height="18" rx="2" fill="#1e1e1e" stroke="#4a4a4a"/>
    <text x="216" y="314">自动遮罩</text>
    <rect x="330" y="300" width="18" height="18" rx="2" fill="#c0192a"/>
    <path d="M334 309 l4 5 l7 -9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="356" y="314">启动时显示控制面板</text>
  </g>

  <!-- actions -->
  <g font-size="13" text-anchor="middle">
    <rect x="14" y="336" width="118" height="28" rx="3" fill="#1e1e1e" stroke="#3a3a3a"/>
    <text x="73" y="355" fill="#d8d8d8">重置为默认</text>
    <rect x="376" y="336" width="96" height="28" rx="3" fill="#1e1e1e" stroke="#3a3a3a"/>
    <text x="424" y="355" fill="#d8d8d8">重新检测</text>
    <rect x="482" y="336" width="86" height="28" rx="3" fill="#1e1e1e" stroke="#3a3a3a"/>
    <text x="525" y="355" fill="#d8d8d8">打开日志</text>
  </g>

  <text x="14" y="392" fill="#969696" font-size="12">参数实时生效；取消勾选「启用 DLSSNR」为真正的直通。</text>

  <!-- annotations -->
  <g stroke="#4a90d9" stroke-width="1" fill="none">
    <path d="M219 82 L219 96" stroke-dasharray="3 3"/>
    <path d="M139 128 L139 138" stroke-dasharray="3 3"/>
    <path d="M73 378 L73 392" stroke-dasharray="3 3"/>
  </g>
  <g fill="#7fb3e8" font-size="11">
    <text x="228" y="96">① 第三个页签 = 暂停对比</text>
    <text x="140" y="128">② 风格 / 滑块 / 勾选都实时生效</text>
    <text x="80" y="378">③ 勾掉总开关＝真正直通，可同屏 A/B</text>
  </g>
</svg>
