; ===========================================================================
;  dlssnr_dshow.ini -- configuration for the DLSS Neural Render DirectShow filter
;
;  Place this file next to dlssnr_dshow.dll. If it is absent, the defaults below
;  are used. The file is read when the filter is created, so a player restart is
;  needed after editing.
; ===========================================================================

[DLSSNR]

; Master switch. 0 = pure pass-through (useful for an A/B comparison while
; watching the same clip -- just toggle and restart the player).
enabled=1

; Denoiser style. 0 is the standard DLSSNR behaviour.
style=0

; All three strengths are PERCENTAGES, 0..100.
;   100 = full strength (the value used throughout development)
;     0 = effectively off
; Lower values are useful when the effect looks too aggressive on clean footage.
intensity=100

; Local tone mapping. This is the control that alters overall contrast on
; gradients (measured: it clips highlights upward and pushes shadows down), so
; it is the first thing to reduce if the picture looks "punchy" or washed out.
localtone=100

; Local structure enhancement (detail synthesis / sharpening).
localstruct=100

; ---------------------------------------------------------------------------
; Control panel
; ---------------------------------------------------------------------------
; 1 = the filter launches dlssnr_panel.py automatically once its engine is ready
;     (i.e. once frames are actually being processed), and the panel hides
;     itself again when the filter goes away.
; 0 = never launch anything. Start the panel yourself if you want it.
;
; Defaults to 0 so a video filter can never spawn windows you did not ask for.
; The panel also holds a single-instance mutex, so repeated launches from a
; player restarting are harmless.
;
; Set to 1 to have the filter launch the panel for you as soon as the engine is
; ready. The panel hides itself again when playback stops/player exits, and a
; single-instance mutex means a player restart will not stack windows.
panel=1
